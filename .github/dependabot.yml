version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Detroit
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Detroit
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /web/custom-assets
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Detroit
    open-pull-requests-limit: 5
    groups:
      custom-assets-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
