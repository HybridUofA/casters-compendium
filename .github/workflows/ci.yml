name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, vet, test, build, and report coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Fyne build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc libgl1-mesa-dev libwayland-dev xorg-dev libxkbcommon-dev

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Check release-version consistency
        run: bash scripts/check-version-consistency.sh

      - name: Vet
        run: go vet -tags migrated_fynedo ./...

      - name: Test default build
        shell: bash
        run: |
          set -o pipefail
          go test -covermode=atomic -coverprofile=coverage-default.out ./... \
            | tee coverage-default.txt

      - name: Test migrated Fyne threading build
        shell: bash
        run: |
          set -o pipefail
          go test -tags migrated_fynedo -covermode=atomic -coverprofile=coverage-migrated.out ./... \
            | tee coverage-migrated.txt

      - name: Summarize package coverage
        shell: bash
        run: |
          {
            echo "## Go test coverage"
            echo
            echo "Coverage is reported for visibility and trend review; no arbitrary threshold is enforced."
            echo
            echo "### Default build"
            echo '```text'
            grep -E 'coverage:|\\[no test files\\]' coverage-default.txt
            echo '```'
            echo
            echo "### Migrated Fyne threading build"
            echo '```text'
            grep -E 'coverage:|\\[no test files\\]' coverage-migrated.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profiles
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ github.run_id }}
          path: |
            coverage-default.out
            coverage-default.txt
            coverage-migrated.out
            coverage-migrated.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build deckbuilder
        run: go build -tags migrated_fynedo -trimpath ./cmd/deckbuilder

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - name: Install Fyne analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc libgl1-mesa-dev libwayland-dev xorg-dev libxkbcommon-dev

      - name: Scan Go dependencies and reachable code
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""
          go-version-file: go.mod
          go-package: ./...
          cache: false
